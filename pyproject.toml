[project]
name = "opentes-integration"
version = "0.1.0"
description = "Local Python environment for OpenTES simulator integration."
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "pade-agents==3.0",
    "tteso-market-opentes",
    "grid-opentes",
    "mosaik==3.5.0",
    "mosaik-api==3.0.6",
    "mosaik-api-v3>=3.0.13,<3.1",
    "pandas>=2.3.2",
    "matplotlib>=3.10.0",
    "py-dss-interface>=2.3.0",
    "pyzmq>=26.0.3,<28",
    "setuptools==69.5.1",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.uv]
package = false

# O PADE vem do PyPI; o mercado, do submodulo do TTESO. O adaptador OpenDSS do
# TSRE nao entra neste ambiente: o pacote dele tambem se chama `simulators`, como
# o do temp/grid-opentes, e roda so no conteiner `grid`.
[tool.uv.sources]
tteso-market-opentes = { path = "teams/tteso-market-opentes", editable = true }
grid-opentes = { path = "temp/grid-opentes", editable = true }
