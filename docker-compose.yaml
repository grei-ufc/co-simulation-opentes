name: opentes

# Co-simulacao do mercado transativo sobre a IEEE 13 barras. O codigo de cada
# time vem dos submodulos em teams/ (git submodule), montado nos conteineres;
# temp/ guarda o que ainda nao foi absorvido por um time (imagens, o cenario e a
# rede 6TiSCH) e se esvazia a medida que cada time assume a sua parte.
# Cinco servicos, um por dominio, mais a alternativa do TSCC para a rede:
#
#   comm       OMNeT++: rede 6TiSCH entre os agentes (so com NET_BACKEND=omnet)
#   comm-tscc  a rede do TSCC no lugar do comm (NET_BACKEND=omnet COMM=tscc)
#   grid       OpenDSS: o circuito, resolvido a cada passo de 15 min
#   collector  grava as tensoes e potencias de cada passo num CSV
#   pade       os agentes PADE (prosumidores, concentrador, DSO, mercado)
#   mosaik     o orquestrador: liga os agentes ao circuito no mesmo relogio
#
# Nao suba na mao: use ./run.sh, que sobe na ordem certa e espera cada um ficar
# pronto. Os simuladores --remote (grid e collector) aceitam UMA conexao e
# encerram; nao os sonde por TCP.

services:
  comm:
    build:
      context: ./temp/comm-opentes
      dockerfile: Dockerfile
    image: opentes/comm:local
    container_name: opentes-comm
    expose:
      - "5556"
    volumes:
      - ./temp/comm-opentes:/root/models
      # Posicoes dos agentes e saida `tisch_links.csv` (a rede de radio simulada).
      - ./teams/tsre-der-opentes/data:/grid-data
    command: >-
      bash -lc "source /root/omnetpp/setenv &&
      opp_makemake -f --deep -O out -o sim_exec -lzmq && make -j4 &&
      ./sim_exec -u Cmdenv -c General
      --**.tisch.mac='\"${TISCH_MAC:-tsch}\"'
      --**.tisch.cells_per_slotframe=${TISCH_CELLS:-2}
      --**.tisch.phy_rate_bps=${TISCH_RATE_BPS:-50000}
      ${TISCH_ARGS:-}"
    networks:
      - opentes-net

  # A rede de comunicacao do TSCC (teams/tscc-com-opentes), no modo de consulta
  # por mensagem: cada envio de um agente atravessa os AgentNodes da topologia
  # IEEE 13 do TSCC. Responde no mesmo endereco do `comm` (alias), e o run.sh sobe
  # um ou outro. Todos os canais do TSCC servem; os da tese (Link_6TiSCH_TSCH e
  # Link_WiSUN_FAN) reproduzem o `comm`.
  comm-tscc:
    build:
      context: ./teams/tscc-com-opentes/omnet-dir
      dockerfile: Dockerfile
    image: opentes/comm-tscc:local
    container_name: opentes-comm-tscc
    expose:
      - "5556"
    environment:
      - OMNET_PORT=5556
      # Canal(is) de Profiles.ned do TSCC, separados por virgula.
      - TSCC_CANAL=${TSCC_CANAL:-Link_6TiSCH_TSCH}
      # malha (enlaces pelo modelo de radio da tese, rotas multissalto) ou
      # estrela (cada barra direto ao concentrador).
      - TSCC_TOPOLOGIA=${TSCC_TOPOLOGIA:-malha}
      # radio (como na tese) ou cabo (concentrador, DSO e mercado por Link_Wired).
      - TSCC_SUBESTACAO=${TSCC_SUBESTACAO:-radio}
      # tisch_links.csv a repetir; vazio = levantamento de radio sorteado.
      - TSCC_ENLACES=${TSCC_ENLACES:-}
      - TSCC_SEMENTE=${TSCC_SEMENTE:-0}
      - TISCH_CELLS=${TISCH_CELLS:-2}
      - TISCH_RATE_BPS=${TISCH_RATE_BPS:-50000}
      # Levantamento dos enlaces simulados (o run.sh aponta para a pasta dos
      # resultados).
      - TSCC_LINKS_CSV=${TSCC_LINKS_CSV:-/tmp/tscc_links.csv}
      # Semente do AgentNode nos canais do repositorio.
      - RANDOM_SEED=${TSCC_SEMENTE:-0}
    volumes:
      - ./teams/tscc-com-opentes:/root/models
      - ./teams/tsre-der-opentes/data:/grid-data:ro
      - ./output:/output
    working_dir: /root/models
    command: >-
      bash -lc "python3 -m cosim.ieee13 --posicoes /grid-data/13Bus/nodes_xy.csv
      --canal $$TSCC_CANAL --topologia $$TSCC_TOPOLOGIA --subestacao $$TSCC_SUBESTACAO
      --cells $$TISCH_CELLS --taxa $$TISCH_RATE_BPS --semente $$TSCC_SEMENTE
      --enlaces \"$$TSCC_ENLACES\"
      --ned omnet-dir/DynamicNetwork.ned --enlaces-csv $$TSCC_LINKS_CSV &&
      source /root/omnetpp/setenv && cd omnet-dir &&
      opp_makemake -f --deep -o sim_exec -lzmq && make -j4 &&
      ./sim_exec -u Cmdenv -f consulta.ini"
    networks:
      opentes-net:
        aliases:
          - comm

  grid:
    build:
      context: ./teams/tsre-der-opentes
      dockerfile: dockerfile
    image: opentes/grid:local
    container_name: opentes-grid
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1   # nao grava .pyc no submodulo
      - PYTHONPATH=/app/src
    volumes:
      # O adaptador OpenDSS e as ferramentas do caso (submodulo do TSRE).
      - ./teams/tsre-der-opentes/src:/app/src:ro
      # O caso IEEE 13: circuito, perfis e matrizes de sensibilidade.
      - ./teams/tsre-der-opentes/data:/app/data
    command: python -u -m simulators.opendss.api_opendss --remote 0.0.0.0:5671
    expose:
      - "5671"
    networks:
      - opentes-net

  collector:
    build:
      context: ./teams/tsre-der-opentes
      dockerfile: dockerfile
    image: opentes/grid:local
    container_name: opentes-collector
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app/src
    volumes:
      # O coletor do TSRE: a fase que a barra nao tem fica NaN no CSV.
      - ./teams/tsre-der-opentes/src:/app/src:ro
      - ./output:/app/output
    command: python -u -m simulators.collector.collector --remote 0.0.0.0:5673
    expose:
      - "5673"
    networks:
      - opentes-net

  pade:
    build:
      context: ./temp/pade-opentes
      dockerfile: Dockerfile
    image: opentes/pade:local
    container_name: opentes-pade
    environment:
      - PADE_PORT=5678
      - AMS_PORT=8000
      - AGENT_STEP_SIZE=900
      - MARKET_OPENTES_PATH=/market
      - MARKET_CONFIG=/grid-data/13Bus/config.json
      - MARKET_DATA_DIR=/grid-data/13Bus
      - MARKET_GRID_DIR=/grid-data/13Bus
      - MARKET_CIRCUIT=/grid-data/13Bus/Master.dss
      # Onde o agente de mercado grava o `run.json` (historico da negociacao e da
      # operacao). O run.sh aponta para a mesma pasta dos resultados eletricos.
      - MARKET_RUN_DIR=${MARKET_RUN_DIR:-/app/output/market}
      # Analise por fase (padrao): o DSO vigia a tensao de cada fase e o preco
      # sombra e por (barra, fase). 0 e a analise por barra, com a media das
      # fases, para comparacao. Ver docs/explanation/market-model.md.
      - MARKET_FASE=${MARKET_FASE:-1}
      # Como o armazenamento injeta nas fases: `independente` (inversor de quatro
      # fios, cada fase despachada separadamente) ou `equilibrado` (tres fios,
      # potencia igual nas fases).
      - MARKET_DISPOSITIVO=${MARKET_DISPOSITIVO:-independente}
      # Regulador: `previsao` aplica as derivacoes do ponto de operacao da
      # previsao (as da matriz de sensibilidade); `neutro` as deixa em 0.
      - MARKET_REGULADOR=${MARKET_REGULADOR:-previsao}
      # Teto de rodadas da decomposicao dual. Com o criterio relativo, a IEEE 13
      # converge em 48 rodadas por barra, 42 por fase e 63 com o inversor de tres
      # fios; o teto fica com folga.
      - MARKET_MAX_ROUNDS=${MARKET_MAX_ROUNDS:-150}
      # Tempo limite de relogio de cada ciclo antes de retransmitir. Vazio: 120 s
      # com entrega ideal e tres janelas de tempo de rede nos outros backends.
      - MARKET_ROUND_TIMEOUT=${MARKET_ROUND_TIMEOUT:-}
      - MARKET_ALPHA=${MARKET_ALPHA:-0.6}
      # Criterio de parada: `relativo` para quando o desacordo entre
      # concentrador e DSO, em toda variavel e intervalo, fica abaixo de
      # MARKET_EPS_REL vezes a potencia do proprio dispositivo; `absoluto` e o
      # |dlambda| <= MARKET_EPS da formulacao de referencia, para comparacao.
      - MARKET_CRITERIO=${MARKET_CRITERIO:-relativo}
      - MARKET_EPS_REL=${MARKET_EPS_REL:-1e-3}
      - MARKET_EPS=${MARKET_EPS:-1e-3}
      - MARKET_SCENARIOS=${MARKET_SCENARIOS:-1}
      - MARKET_NEGOTIATE=${MARKET_NEGOTIATE:-1}
      - MARKET_OPERATION=${MARKET_OPERATION:-1}
      - MARKET_REALIZED=${MARKET_REALIZED:-1}
      # Como a demanda realizada difere da programada: `perturb` altera a
      # programacao de cada prosumidor em ate +/-10% (MARKET_REALIZED_SPREAD).
      - MARKET_REALIZED_MODE=${MARKET_REALIZED_MODE:-perturb}
      - MARKET_REALIZED_SPREAD=${MARKET_REALIZED_SPREAD:-0.10}
      - MARKET_REALIZED_DAY=${MARKET_REALIZED_DAY:-9}
      # Margem aplicada aos limites de tensao dentro do modelo do DSO, contra o
      # erro da linearizacao.
      - MARKET_V_BACKOFF=${MARKET_V_BACKOFF:-1e-3}
      # Limiar de ACAO da fase de operacao; o limite continua 0,97 e 1,03.
      - MARKET_V_ACAO_MIN=${MARKET_V_ACAO_MIN:-0.971}
      - MARKET_V_ACAO_MAX=${MARKET_V_ACAO_MAX:-1.03}
      # O CPLEX vem do host por volume: licenca academica e pessoal, nao entra
      # na imagem nem no repositorio.
      - MARKET_SOLVER=${MARKET_SOLVER:-cplex}
      - MARKET_SOLVER_PATH=/opt/cplex/bin/x86-64_linux/cplex
      # Fator de potencia do armazenamento. `none` e a hipotese dQ = 0.
      - MARKET_STORAGE_PF=${MARKET_STORAGE_PF:-none}
      # Camada de rede entre os agentes: `ideal` (entrega imediata), `lossy`
      # (perda e atraso sorteados) ou `omnet` (a rede 6TiSCH do servico comm).
      - NET_BACKEND=${NET_BACKEND:-ideal}
      - NET_TIME_SCALE=${NET_TIME_SCALE:-1.0}
      # Probabilidade de perda por mensagem no backend `lossy`.
      - NET_DROP_PROBABILITY=${NET_DROP_PROBABILITY:-0.0}
      - NET_TRACE=${NET_TRACE:-}
      # Tamanho informado a rede: `real` usa o conteudo serializado;
      # `declarado`, as classes de tamanho fixas da implementacao de referencia.
      - NET_MESSAGE_SIZE=${NET_MESSAGE_SIZE:-real}
      - OMNET_HOST=comm
      - OMNET_NET_PORT=5556
    expose:
      - "5678"
    volumes:
      # Os agentes (teams/tteso-agents-opentes) e o modelo de mercado
      # (teams/tteso-market-opentes), lidos dos submodulos do TTESO. O PADE vem
      # instalado na imagem, do PyPI (pade-agents).
      - ./teams/tteso-agents-opentes/agentes:/app/agents:ro
      - ./teams/tteso-market-opentes:/market:ro
      - ./teams/tsre-der-opentes/data:/grid-data:ro
      - ./output:/app/output
      - ${CPLEX_HOME:-/nonexistent}:/opt/cplex:ro
    command: python3 agents/market_agents.py
    networks:
      - opentes-net

  mosaik:
    build:
      context: ./temp/mosaik-opentes
      dockerfile: Dockerfile
    image: opentes/mosaik:local
    container_name: opentes-mosaik
    depends_on:
      - pade
      - grid
      - collector
    environment:
      - MOSAIK_OUTPUT_DIR=${MOSAIK_OUTPUT_DIR:-/app/output/market}
      - MOSAIK_N_PASSOS=${MOSAIK_N_PASSOS:-96}
      - MOSAIK_STEP_SIZE=900
      - RESULT_TAG=${RESULT_TAG:-negociado}
      - MARKET_CIRCUIT=/app/data/13Bus/Master.dss
      - MARKET_FASE=${MARKET_FASE:-1}
      - MARKET_REGULADOR=${MARKET_REGULADOR:-previsao}
      - PADE_HOST=pade
      - PADE_PORT=5678
      - OPENDSS_HOST=grid
      - ELEC_COLLECTOR_HOST=collector
    volumes:
      - ./temp/mosaik-opentes:/app
      - ./output:/app/output
    command: python -u scenarios/market.py
    networks:
      - opentes-net

networks:
  opentes-net:
    driver: bridge
