[General]
network = CoSimulationNetwork
scheduler-class = "omnetpp::cSequentialScheduler"
sim-time-limit = 1000s

# Resolucao do relogio de simulacao. Vale para o arquivo inteiro: o OMNeT++ so
# aceita esta opcao na secao [General]. No padrao de picossegundos o simtime_t de
# 64 bits estoura em cerca de 9,2e6 s, ou 106 dias, e a configuracao `tisch`, que
# acumula o atraso de todas as mensagens no mesmo relogio, morre no meio da
# negociacao. Em nanossegundos o teto sobe para 9,2e9 s, com resolucao de sobra
# para uma rede cujo slotframe e de 4 s.
simtime-scale = -9

# Semente fixa: torna o jitter/perda REPRODUTIVEL entre execucoes (mesmo padrao
# de rede a cada run), sem deixar de ser estocastico ao longo do tempo.
seed-set = 0
seed-0-mt = 1

# Largura de banda
**.node_0.bandwidth_bps = 50000.0

# Perda de pacotes: PARAMETRO DE MODELO da rede de comunicacao (qualidade do
# canal), NAO uma saida da co-simulacao. Valor herdado do modelo do TSCC (0.15 =
# 15%); deve ser calibrado conforme a rede real da aplicacao. Use 0.0 apenas para
# o caso idealizado (canal perfeito).
**.node_0.drop_probability = 0.15

# Jitter: Injeta uma média de 50ms de atraso caótico nas filas
**.node_0.jitter_mean = 0.05
# ---------------------------------------------------------------------------
# Rede LPWA 6TiSCH da tese (subsecao 6.1.5), como servidor de rotas.
#
# Nao participa do passo do Mosaik: a negociacao inteira acontece DENTRO de um
# passo de 15 min, com o relogio da co-simulacao parado, entao os agentes PADE
# consultam esta rede por ZMQ a cada envio. Ver Tisch.cc.
#
#   ./sim_exec -u Cmdenv -c tisch
# ---------------------------------------------------------------------------
[Config tisch]
network = TischNetwork
# O tempo avanca por consulta de rota, nao por passo de simulacao, e NAO volta
# ao zero entre consultas: cada mensagem empurra o relogio pelo seu proprio
# atraso. Com as mensagens reais de dezenas de kB, uma negociacao inteira soma
# milhoes de segundos simulados.
#
# O `simtime-scale` precisa vir junto. No padrao de picossegundos o simtime_t de
# 64 bits estoura em cerca de 9,2e6 s, ou 106 dias, e a simulacao morre no meio
# da negociacao. Em nanossegundos o teto sobe para 9,2e9 s, e a resolucao segue
# folgada para uma rede cujo slotframe e de 4 s.
sim-time-limit = 1000000000s
**.tisch.positions_file = "nodes_xy.csv"
**.tisch.links_csv = "tisch_links.csv"
